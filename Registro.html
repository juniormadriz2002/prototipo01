<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Profesional - Sistema de Gestión</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="estilos.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    
    <style>
        body { 
            margin: 0; display: flex; justify-content: flex-end; align-items: center; min-height: 100vh;
            background-image: url(logo.jpg);
            background-size: cover;
        }
    </style>
</head>
<body>

<div class="registro-container">
    <h2 class="text-center mb-2">Registro de Usuario</h2>
    <p class="text-center mb-4">Gestión de Clientes - Conexión Segura</p>
    
    <form id="registroForm">
        <div class="mb-3">
            <label class="form-label fw-bold">Cédula de Identidad</label>
            <input type="number" id="cedula" class="form-control" placeholder="Ej. 28478809" required>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Fecha de Nacimiento</label>
            <input type="date" id="fecha_nacimiento" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Sexo / Género</label>
            <select id="sexo" class="form-select" required>
                <option value="" selected disabled>Seleccione...</option>
                <option value="m">Masculino</option>
                <option value="f">Femenino</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Nombre</label>
            <input type="text" id="nombre" class="form-control" placeholder="Ej. Juan Andres" required>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Apellido</label>
            <input type="text" id="apellido" class="form-control" placeholder="Ej. Perez Galicia" required>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Número de Teléfono</label>
            <input type="text" id="telefono" class="form-control" placeholder="Ej. 04124657654" required>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Correo Electrónico Personal</label>
            <input type="email" id="email_personal" class="form-control" placeholder="Ej. usuario@correo.com" required>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Territorio Asignado</label>
            <select id="territorio_id" class="form-select" required>
                <option value="" selected disabled>Cargando territorios...</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Dirección</label>
            <input type="text" id="direccion" class="form-control" placeholder="Dirección de Residencia" required>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Profesión</label>
            <input type="text" id="profesion" class="form-control" placeholder="Ej. Ingeniero, Comerciante, Docente" required>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Contraseña de Acceso</label>
            <div class="input-group">
                <input type="password" id="contrasena_acceso" class="form-control" placeholder="Mínimo 16 caracteres" required style="border-right: none;">
                <button class="btn btn-toggle-password" type="button" id="btn-toggle-password">
                    <i class="bi bi-eye" id="icon-eye"></i>
                </button>
            </div>
        </div>

        <!-- Preguntas y respuestas de seguridad -->
        <div class="mb-3">
            <label class="form-label fw-bold">Pregunta de Seguridad 1</label>
            <select id="pregunta_seguridad_1" class="form-select" required>
                <option value="" selected disabled>Seleccione...</option>
                <option value="Nombre de mascota">Nombre de mascota</option>
                <option value="Ciudad de nacimiento">Ciudad de nacimiento</option>
                <option value="Segundo Nombre del Abuelo Materno">Segundo Nombre del Abuelo Materno</option>
                <option value="Marca de Vehiculo Favorita">Marca de Vehiculo Favorita</option>
                <option value="Color Favorito">Color Favorito</option>
                <option value="Super Heroe Favorito">Super Heroe Favorito</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label fw-bold">Respuesta de Seguridad 1</label>
            <input type="text" id="respuesta_seguridad_1" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Pregunta de Seguridad 2</label>
            <select id="pregunta_seguridad_2" class="form-select" required>
                <option value="" selected disabled>Seleccione...</option>
                <option value="Nombre de mascota">Nombre de mascota</option>
                <option value="Ciudad de nacimiento">Ciudad de nacimiento</option>
                <option value="Segundo Nombre del Abuelo Materno">Segundo Nombre del Abuelo Materno</option>
                <option value="Marca de Vehiculo Favorita">Marca de Vehiculo Favorita</option>
                <option value="Color Favorito">Color Favorito</option>
                <option value="Super Heroe Favorito">Super Heroe Favorito</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label fw-bold">Respuesta de Seguridad 2</label>
            <input type="text" id="respuesta_seguridad_2" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Pregunta de Seguridad 3</label>
            <select id="pregunta_seguridad_3" class="form-select" required>
                <option value="" selected disabled>Seleccione...</option>
                <option value="Nombre de mascota">Nombre de mascota</option>
                <option value="Ciudad de nacimiento">Ciudad de nacimiento</option>
                <option value="Segundo Nombre del Abuelo Materno">Segundo Nombre del Abuelo Materno</option>
                <option value="Marca de Vehiculo Favorita">Marca de Vehiculo Favorita</option>
                <option value="Color Favorito">Color Favorito</option>
                <option value="Super Heroe Favorito">Super Heroe Favorito</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label fw-bold">Respuesta de Seguridad 3</label>
            <input type="text" id="respuesta_seguridad_3" class="form-control" required>
        </div>

        <div class="g-recaptcha mb-3" data-sitekey="6LccXdssAAAAAFxoNuzMdHES2OtmkmEe46ICpvK1"></div>

        <button type="submit" id="btnRegistro" class="btn btn-primary btn-lg w-100 mt-2">Finalizar Registro</button>
    </form>

    <a href="Login.html">
        <button type="button" id="btn_iniciar_secion" class="btn btn-danger btn-lg w-100 mt-2">Iniciar Sesión</button>
    </a>
</div>

<script>
const SUPABASE_URL = "https://ttyvwbahzhqkotndrhgv.supabase.co";
const SUPABASE_KEY = "sb_publishable_xQ70-YHC-hpwZvF1BJKfpg_qvHy-J4W"; 
const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function cargarTerritorios() {
    const selectTerritorio = document.getElementById("territorio_id");
    try {
        const { data: territorios, error } = await _supabase
            .from('territorios')
            .select('id, nombre')
            .order('nombre', { ascending: true });

        if (error) throw error;

        selectTerritorio.innerHTML = '<option value="" selected disabled>Seleccione su territorio...</option>';
        
        if (territorios && territorios.length > 0) {
            territorios.forEach(t => {
                const option = document.createElement('option');
                option.value = t.id; 
                option.textContent = t.nombre; 
                selectTerritorio.appendChild(option);
            });
        } else {
            const option = document.createElement('option');
            option.value = "";
            option.disabled = true;
            option.textContent = "No hay territorios creados actualmente";
            selectTerritorio.appendChild(option);
        }
    } catch (err) {
        console.error("Error al cargar territorios:", err);
        selectTerritorio.innerHTML = '<option value="" selected disabled>Error al cargar territorios</option>';
    }
}

cargarTerritorios();

const btnTogglePassword = document.getElementById('btn-toggle-password');
const txtClave = document.getElementById('contrasena_acceso');
const iconEye = document.getElementById('icon-eye');

if (btnTogglePassword && txtClave && iconEye) {
    btnTogglePassword.addEventListener('click', () => {
        const isPassword = txtClave.type === 'password';
        txtClave.type = isPassword ? 'text' : 'password';
        iconEye.classList.toggle('bi-eye', !isPassword);
        iconEye.classList.toggle('bi-eye-slash', isPassword);
    });
}

document.getElementById("cedula").addEventListener("keypress", function(e) {
    if (e.which < 48 || e.which > 57) e.preventDefault();
});

document.getElementById("registroForm").addEventListener("submit", async function(event) {
    event.preventDefault();
    
    const btn = document.getElementById("btnRegistro");

    const cedula = document.getElementById("cedula").value.trim();
    const nombre = document.getElementById("nombre").value.trim();
    const apellido = document.getElementById("apellido").value.trim();
    const emailPersonal = document.getElementById("email_personal").value.trim();
    const territorioId = document.getElementById("territorio_id").value;
    const direccion = document.getElementById("direccion").value.trim();
    const profesion = document.getElementById("profesion").value.trim();
    const contrasena = document.getElementById("contrasena_acceso").value;
    const fechaNacimiento = document.getElementById("fecha_nacimiento").value;
    const telefono = document.getElementById("telefono").value.trim();
    const sexo = document.getElementById("sexo").value;

    const p1 = document.getElementById("pregunta_seguridad_1").value;
    const r1 = document.getElementById("respuesta_seguridad_1").value.trim().toLowerCase();
    const p2 = document.getElementById("pregunta_seguridad_2").value;
    const r2 = document.getElementById("respuesta_seguridad_2").value.trim().toLowerCase();
    const p3 = document.getElementById("pregunta_seguridad_3").value;
    const r3 = document.getElementById("respuesta_seguridad_3").value.trim().toLowerCase();

    const captchaResponse = grecaptcha.getResponse();
    if (!captchaResponse || captchaResponse.length === 0) { 
        alert("Por favor, verifica que no eres un robot.");
        return;
    }

    if (contrasena.length < 16) {
        alert("La contraseña debe contener al menos 16 caracteres.");
        document.getElementById("contrasena_acceso").focus();
        return;
    }

    if (p1 === p2 || p1 === p3 || p2 === p3) {
        alert("Por favor, selecciona 3 preguntas de seguridad diferentes.");
        return;
    }

    // Calcular edad automáticamente a partir de la fecha de nacimiento
    let edadCalculada = null;
    if (fechaNacimiento) {
        const fechaNac = new Date(fechaNacimiento);
        const hoy = new Date();
        edadCalculada = hoy.getFullYear() - fechaNac.getFullYear();
        const mes = hoy.getMonth() - fechaNac.getMonth();
        if (mes < 0 || (mes === 0 && hoy.getDate() < fechaNac.getDate())) {
            edadCalculada--;
        }
    }

    btn.disabled = true;
    btn.innerText = "Procesando...";

    try {
        const emailAuthInterno = `${cedula}@sistema.com`;

        const { data: authData, error: authError } = await _supabase.auth.signUp({
            email: emailAuthInterno,
            password: contrasena
        });

        if (authError) throw authError;

        // Inserción en la tabla usuarios con TODOS los campos mapeados correctamente
        const { data: usuarioData, error: dbError } = await _supabase
            .from('usuarios')
            .insert([
                { 
                    cedula: cedula,
                    nombre: nombre,
                    apellido: apellido,
                    email: emailAuthInterno,
                    email_personal: emailPersonal,
                    telefono: telefono,
                    fecha_nacimiento: fechaNacimiento,
                    edad: edadCalculada,
                    sexo: sexo,
                    profesion: profesion,
                    tipo_usuario: 'miembro',
                    estado_usuario: 'activo',
                    direccion: direccion,
                    pregunta_seguridad_1: p1,
                    respuesta_seguridad_1: r1,
                    pregunta_seguridad_2: p2,
                    respuesta_seguridad_2: r2,
                    pregunta_seguridad_3: p3,
                    respuesta_seguridad_3: r3
                }
            ])
            .select('id')
            .single();

        if (dbError) {
            if (dbError.code === '23505') {
                alert("La cédula ingresada ya se encuentra registrada en el sistema.");
            } else {
                alert("Error al guardar en la base de datos: " + dbError.message);
            }
            return;
        }

        const nuevoUsuarioId = usuarioData.id;
        if (territorioId) {
            await _supabase.from('miembros').insert([
                { usuario_id: nuevoUsuarioId, territorio_id: parseInt(territorioId) }
            ]);
        }

        alert("¡Usuario registrado con éxito!");
        document.getElementById("registroForm").reset();
        grecaptcha.reset();
        cargarTerritorios();

    } catch (err) {
        alert("Error crítico: " + err.message);
    } finally {
        btn.disabled = false;
        btn.innerText = "Finalizar Registro";
    }
});
</script>

</body>
</html>
