<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualizar Contraseña - Sistema de Gestión</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- IMPORTAR EL CEREBRO DE SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link rel="stylesheet" href="estilos.css">

    <style>
        body { 
            margin: 0; display: flex; justify-content: flex-end; align-items: center; min-height: 100vh;
            background-image: url(logo.jpg);
            background-size: cover; background-attachment: fixed;
        }
    </style>
</head>
<body>

    <div class="restablecer-container">
        <h2 class="text-center mb-2">Nueva Contraseña</h2>
        <p class="text-center mb-4">Gestión de Clientes - Conexión Segura</p>
        
        <form id="actualizar_form">
            <div class="mb-3">
                <label class="form-label fw-bold">Nueva Contraseña</label>
                <input type="password" id="password" class="form-control" required minlength="6" placeholder="16 caracteres">
            </div>

            <button type="submit" id="btnactualizar" class="btn btn-warning btn-lg w-100 mt-2">Actualizar Contraseña</button>            
        </form>
        
        <a href="Login.html" class="text-decoration-none">
            <button type="button" id="btn_iniciar_secion" class="btn btn-primary btn-lg w-100 mt-2">Iniciar Sesión</button>
        </a>
    </div>

    <script>
        // Tus credenciales públicas de Supabase
        const SUPABASE_URL = "https://ttyvwbahzhqkotndrhgv.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_xQ70-YHC-hpwZvF1BJKfpg_qvHy-J4W"; 
        const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
        const formulario = document.getElementById('actualizar_form');
    
        if (formulario) {
            formulario.addEventListener('submit', async function(e) {
                e.preventDefault();
    
                const passwordInput = document.getElementById('password').value.trim();
                if (!passwordInput) {
                    alert("Por favor, ingresa una contraseña válida.");
                    return;
                }
    
                const btnActualizar = document.getElementById('btnactualizar');
                btnActualizar.disabled = true;
                btnActualizar.textContent = "Actualizando...";
    
                try {
                    // Actualizar la contraseña del usuario utilizando el token del enlace de recuperación
                    const { data, error } = await _supabase.auth.updateUser({
                        password: passwordInput
                    });
    
                    if (error) {
                        console.error("Error al actualizar la contraseña:", error);
                        alert("Error: " + error.message);
                        return;
                    }
    
                    alert("¡Contraseña actualizada con éxito! Redirigiendo al inicio de sesión...");
                    
                    // INVALIDAR EL ENLACE: Cierra la sesión activa creada por el token
                    await _supabase.auth.signOut();

                    // Limpia el token de la barra de direcciones del navegador
                    window.history.replaceState({}, document.title, window.location.pathname);

                    formulario.reset();

                    // Redirigir al Login
                    setTimeout(() => {
                        window.location.href = 'Login.html';
                    }, 1500);
    
                } catch (err) {
                    console.error("Error inesperado:", err);
                    alert("Ocurrió un error inesperado al conectar con el servidor.");
                } finally {
                    btnActualizar.disabled = false;
                    btnActualizar.textContent = "Actualizar Contraseña";
                }
            });
        }
    </script>

</body>
</html>
