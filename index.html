<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vida Nueva - Sistema de Gestión</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- BIBLIOTECA DE ICONOS DE BOOTSTRAP -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- IMPORTAR SUPABASE (Se removió crypto-js por redundancia) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    
    <link rel="stylesheet" href="estilos.css">

    <style>
        body { 
            margin: 0; display: flex; justify-content: flex-end; align-items: center; min-height: 100vh;
            background-image: url(logo.jpg);
            background-size: cover;
        }
    </style>

    <script>
        const SUPABASE_URL = "https://ttyvwbahzhqkotndrhgv.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_xQ70-YHC-hpwZvF1BJKfpg_qvHy-J4W"; 
        const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Verificamos si realmente hay una sesión activa antes de redirigir
async function verificarSesion() {
            const { data: { session } } = await _supabase.auth.getSession();
            // Solo redirige si hay sesión y NO estamos viniendo de un cierre de sesión manual
            if (session && window.location.pathname.includes('index.html')) {
                // Opcional: validar que el usuario exista en sessionStorage para evitar falsos positivos
                if (sessionStorage.getItem('usuario_id')) {
                    window.location.href = 'panel.html';
                }
            }
        }
        verificarSesion();
    </script>
</head>
<body>

    <div class="login-container">
        <h2 class="text-center mb-2">Inicio de Sesión</h2>
        <p class="text-center mb-4">Gestión de Clientes - Conexión Segura</p>
        
        <form id="login_form">
    <div class="mb-3">
        <label class="form-label fw-bold">Cédula de Identidad</label>
        <input type="text" id="cedula" class="form-control" autocomplete="off" maxlength="8" pattern="[0-9]*" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 8);" required>
    </div>
    
            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label class="form-label fw-bold mb-0">Contraseña</label>
                    <a href="Restablecer.html" class="text-decoration-none small fw-semibold text-primary">¿Olvidaste tu contraseña?/¿Usuario Bloqueado?</a>
                </div>
                <div class="input-group">
                    <input type="password" id="clave" class="form-control" autocomplete="current-password" required style="border-right: none;">
                    <button class="btn btn-toggle-password" type="button" id="btn-toggle-password">
                        <i class="bi bi-eye" id="icon-eye"></i>
                    </button>
                </div>
            </div>

            <div class="g-recaptcha" data-sitekey="6LccXdssAAAAAFxoNuzMdHES2OtmkmEe46ICpvK1"></div>

            <button type="submit" id="btnLogin" class="btn btn-primary btn-lg w-100 mt-2">Login</button>
        </form>

        <a href="Registro.html">
            <button type="button" id="btn_registrarse" class="btn btn-danger btn-lg w-100 mt-2">Registrarse</button>
        </a>
    </div>

    <script>
        // ==========================================
        // FUNCIONALIDAD: Mostrar/Ocultar Contraseña
        // ==========================================
        const btnTogglePassword = document.getElementById('btn-toggle-password');
        const txtClave = document.getElementById('clave');
        const iconEye = document.getElementById('icon-eye');

        if (btnTogglePassword && txtClave && iconEye) {
            btnTogglePassword.addEventListener('click', () => {
                if (txtClave.type === 'password') {
                    txtClave.type = 'text';
                    iconEye.classList.remove('bi-eye');
                    iconEye.classList.add('bi-eye-slash');
                } else {
                    txtClave.type = 'password';
                    iconEye.classList.remove('bi-eye-slash');
                    iconEye.classList.add('bi-eye');
                }
            });
        }
    
        // ==========================================
        // PROCESO DE LOGIN CON SUPABASE AUTH
        // ==========================================
        document.getElementById('login_form').addEventListener('submit', async (e) => {
            e.preventDefault(); 

            // 1. Validar reCAPTCHA
            const captchaResponse = grecaptcha.getResponse();
            if (!captchaResponse || captchaResponse.length === 0) { 
                alert("Por favor, verifica que no eres un robot.");
                return;
            }

            const btnLogin = document.getElementById('btnLogin');
            if (btnLogin) {
                btnLogin.disabled = true;
                btnLogin.innerText = "Procesando...";
            }

            const cedula = document.getElementById('cedula').value.trim();
            const contrasena = document.getElementById('clave').value; 

            try {
                // Transformar cédula al correo técnico interno requerido por Supabase Auth
                const emailAuthInterno = `${cedula}@sistema.com`;

                // 2. Autenticación oficial mediante Supabase Auth
                const { data: authData, error: authError } = await _supabase.auth.signInWithPassword({
                    email: emailAuthInterno,
                    password: contrasena
                });

                if (authError) throw new Error("Cédula o contraseña incorrectas.");

                // 3. Consultar datos complementarios en la tabla 'usuarios' usando la cédula
                const { data: usuarios, error: dbError } = await _supabase
                    .from('usuarios')
                    .select('id, tipo_usuario, estado_usuario')
                    .eq('cedula', cedula)
                    .limit(1);

                if (dbError || !usuarios || usuarios.length === 0) {
                    throw new Error("No se encontró el perfil asociado a este usuario.");
                }

                const usuario = usuarios[0];

                if (usuario.estado_usuario !== 'activo') {
                    await _supabase.auth.signOut();
                    throw new Error("El usuario se encuentra inactivo o bloqueado.");
                }

                // 4. Consultar territorio asociado (si es miembro)
                const { data: miembroData } = await _supabase
                    .from('miembros')
                    .select('territorio_id')
                    .eq('usuario_id', usuario.id)
                    .maybeSingle();

                // Guardar datos útiles en SessionStorage para el panel
                sessionStorage.setItem('usuario_id', usuario.id);
                sessionStorage.setItem('usuario_tipo', usuario.tipo_usuario);
                sessionStorage.setItem('usuario_territorio', miembroData?.territorio_id || '');

                document.getElementById('clave').value = '';

                alert('¡Bienvenido!');
                window.location.href = 'panel.html'; 

            } catch (err) {
                alert(err.message || "Error de conexión con el servidor.");
                console.error("Detalles del fallo:", err);
            } finally {
                if (btnLogin) {
                    btnLogin.disabled = false;
                    btnLogin.innerText = "Login";
                }
                grecaptcha.reset(); 
            }
        });
    </script>
</body>
</html>
